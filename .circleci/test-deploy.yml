version: 2.1

orbs:
  git-release-information: {}
  orb-tools: circleci/orb-tools@12.0.2

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Exercise the command against this repository's own tag history. dry_run
  # keeps it from posting to a real Slack channel, so no webhook or context is
  # needed and the test stays hermetic.
  command-test:
    docker:
      - image: cimg/base:2026.07
    steps:
      - checkout
      - git-release-information/send_release_commit_list:
          repo_name: code-release-slack-messenger-orb
          product_label: C-SAR
          jira_base_url: "https://example.atlassian.net/browse"
          jira_project_keys: "CSAR, INF, DEVTASKS, CCF"
          artifact_dir: ./artifacts
          dry_run: true
      - store_artifacts:
          path: ./artifacts

workflows:
  test-deploy:
    jobs:
      - command-test:
          filters: *filters
      - git-release-information/commit_list_notification:
          name: job-test
          repo_name: code-release-slack-messenger-orb
          product_label: C-SAR
          dry_run: true
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/publish:
          orb_name: cropster/git-release-information
          vcs_type: << pipeline.project.type >>
          pub_type: production
          requires:
            - orb-tools/pack
            - command-test
            - job-test
          context: orb-publishing
          filters: *release-filters
