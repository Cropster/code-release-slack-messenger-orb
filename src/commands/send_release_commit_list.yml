description: >
  Collect the commits belonging to the latest tagged release and post them to a
  Slack incoming webhook, writing a plain-text copy to a build artifact.

  The release is the range between the two most recent release tags, resolved
  with git's own version sort, so the commit set is exact and free of any
  timestamp or timezone guesswork. Messages are split automatically to stay
  within Slack's 50-block limit, and a rejected message fails the job.

  Requires git, jq and curl, all of which are present in cimg/base.

parameters:
  repo_name:
    type: string
    default: ""
    description: >
      Repository label shown in the message header. When empty, a generic
      label is used.
  product_label:
    type: string
    default: ""
    description: >
      Optional product prefix shown before the repository name in the header,
      for example "C-SAR".
  slack_webhook_env_var:
    type: env_var_name
    default: SLACK_WEBHOOK_URL
    description: >
      Name of the environment variable that holds the Slack incoming webhook
      URL. Only the name is stored in your config, so the URL itself stays out
      of the rendered configuration and is masked in job output. Set the value
      as a project or context environment variable.
  tag_pattern:
    type: string
    default: "v*"
    description: >
      Glob matched against tag names when looking for release tags.
  strict_semver_tags:
    type: boolean
    default: true
    description: >
      Consider only tags shaped like vX.Y.Z or X.Y.Z. This keeps release
      candidates and moving tags such as "nightly" out of the calculation. Set
      to false to accept any tag matching tag_pattern.
  release_scheme:
    type: enum
    enum: ["previous_minor", "previous_tag"]
    default: "previous_minor"
    description: >
      How the start of the release range is chosen.

      "previous_minor" follows a weekly-release cadence: a tag whose patch
      number is 0 is a feature release and spans back to
      <major>.<minor - 1>.0, so hotfixes cut since the previous weekly release
      are included; a tag whose patch number is above 0 is a hotfix and reports
      only its own commit. Falls back to the preceding tag, with a warning, if
      the version is not X.Y.Z or the expected previous release is missing.

      "previous_tag" simply uses the tag immediately below the release tag.
  jira_base_url:
    type: string
    default: ""
    description: >
      Base browse URL for issue links, with no trailing slash, for example
      "https://your-org.atlassian.net/browse". Leave empty to disable linking.
  jira_project_keys:
    type: string
    default: ""
    description: >
      Comma or space separated Jira project keys to link, for example
      "CSAR, INF, DEVTASKS, CCF". The first matching key found anywhere in a
      commit subject is linked. Requires jira_base_url to also be set.
  trigger_tag:
    type: string
    default: ""
    description: >
      The tag this release is for. When empty, $CIRCLE_TAG is used, so a
      tag-triggered pipeline announces the tag it was triggered by rather than
      whichever tag sorts highest. Falls back to the highest matching tag when
      neither is set.
  artifact_dir:
    type: string
    default: "./artifacts"
    description: >
      Directory the plain-text commit list is written to.
  blocks_per_message:
    type: integer
    default: 45
    description: >
      Maximum Slack blocks per message, between 1 and 50. Slack rejects
      messages with more than 50 blocks; the default leaves headroom.
  fetch_tags:
    type: boolean
    default: true
    description: >
      Run "git fetch --tags --force" first. CircleCI's checkout does not always
      bring every tag, and the release range cannot be computed without them. A
      failed fetch is reported as a warning, not an error.
  send_delay:
    type: integer
    default: 1
    description: >
      Seconds to wait between messages when more than one is needed. Slack
      rate limits incoming webhooks to roughly one message per second.
  dry_run:
    type: boolean
    default: false
    description: >
      Build and print the payloads without posting them. Useful for validating
      the command in CI without sending real notifications; no webhook URL is
      required in this mode.

steps:
  - run:
      name: Send release commit list to Slack
      environment:
        RELEASE_REPO_NAME: "<< parameters.repo_name >>"
        RELEASE_PRODUCT_LABEL: "<< parameters.product_label >>"
        RELEASE_WEBHOOK_ENV_VAR: "<< parameters.slack_webhook_env_var >>"
        RELEASE_TAG_PATTERN: "<< parameters.tag_pattern >>"
        RELEASE_STRICT_SEMVER: "<< parameters.strict_semver_tags >>"
        RELEASE_SCHEME: "<< parameters.release_scheme >>"
        RELEASE_JIRA_BASE_URL: "<< parameters.jira_base_url >>"
        RELEASE_JIRA_KEYS: "<< parameters.jira_project_keys >>"
        RELEASE_TRIGGER_TAG: "<< parameters.trigger_tag >>"
        RELEASE_ARTIFACT_DIR: "<< parameters.artifact_dir >>"
        RELEASE_BLOCKS_PER_MSG: "<< parameters.blocks_per_message >>"
        RELEASE_FETCH_TAGS: "<< parameters.fetch_tags >>"
        RELEASE_SEND_DELAY: "<< parameters.send_delay >>"
        RELEASE_DRY_RUN: "<< parameters.dry_run >>"
      command: <<include(scripts/send_release_commit_list.sh)>>
