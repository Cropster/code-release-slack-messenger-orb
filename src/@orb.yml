version: 2.1

description: >
  Publish the commit list for the latest tagged release to a Slack channel.

  The orb resolves the two most recent release tags using git's version sort,
  takes the exact commit range between them, and renders it as Slack Block Kit
  messages, splitting automatically to stay inside Slack's 50-block limit. The
  same list is stored as a build artifact. Optionally turns Jira issue keys
  found in commit subjects into links.

display:
  home_url: "https://www.cropster.com/"
  source_url: "https://github.com/Cropster/code-release-slack-messenger-orb"
